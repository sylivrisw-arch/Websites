/* Preset wallpapers */
.wall{position:absolute;inset:0;z-index:0}.wall i{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease}.wall i.on{opacity:1}
.hero.has-wall{background:#071018}.hero.has-wall .planet,.hero.has-wall .city{display:none}
.wallctl{position:absolute;right:4vw;bottom:18px;z-index:3;display:flex;align-items:center;gap:8px}
.wallctl button,.wallctl span{background:#071018aa;border:1px solid #ffffff30;border-radius:7px;color:#dce5ee;padding:6px 10px;font-size:12px;backdrop-filter:blur(6px)}.wallctl button:hover{background:#25384a}.wallctl span{border-color:transparent;background:none;text-shadow:0 2px 6px #000}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}.wt{height:80px;border-radius:9px;background-size:cover;background-position:center;border:2px solid #ffffff22;position:relative;cursor:pointer;overflow:hidden}.wt:hover{border-color:#ffffff66}.wt.on{border-color:var(--gold);box-shadow:0 0 14px #ffb54a66}.wt span{position:absolute;left:0;right:0;bottom:0;padding:14px 7px 4px;font-size:11px;background:linear-gradient(0deg,#000c,transparent)}.wt.def{background:linear-gradient(90deg,#071018,#122b3c 55%,#673d35)}

/* Each shelf in its own container, with arrows + visible scrollbar */

<div class="topbar"><a class="miniapp" href="https://www.youtube.com/" target="_blank" rel="noopener"><i>▶</i> YouTube</a></div>
<section class="hero" id="home"><div class="wall" id="wall"></div><div class="planet"></div><div class="city"></div><div class="wallctl" id="wallctl"><button id="wOpen" aria-haspopup="listbox" aria-expanded="false">🖼 <span id="wName">Default</span> ▾</button><div class="wmenu" id="wMenu" role="listbox"></div></div><div class="hero-copy"><div class="eyebrow">YOUR PERSONAL CINEMA</div><h1>Your<br>Entertainment Hub</h1><p>All your movies, shows, apps and personal content in one place. Watch, explore and make it yours.</p><div class="actions"><button class="primary" id="heroPlay">▶ &nbsp; PLAY</button><button class="secondary" id="heroInfo">ⓘ &nbsp; MORE INFO</button></div></div></section>
<main>
<section class="shelf" id="drives"><div class="shelf-head"><h2>On Your Drives</h2><span class="shelf-sub">▣ &nbsp; LOCAL LIBRARY</span></div><div class="row" id="driveRow"></div></section>
</main>
<div class="toolbar"><button class="smallbtn" id="addFolder">📁 Scan folder</button><button class="smallbtn" id="reset">Clear all</button><input id="folderInput" type="file" webkitdirectory directory multiple class="hidden"><input id="videoInput" type="file" accept="video/*" multiple class="hidden"><input id="posterInput" type="file" accept="image/*" multiple class="hidden"></div>
<div class="footer">🎮 &nbsp; <b>Xbox Controller / Remote:</b> Navigate · Select · Back</div><div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="dialog" id="dialog"><button class="close" id="close">×</button><div id="dialogBody"></div></div></div>
<script>
const apps=[['YouTube','▶'],['Paramount+','✦'],['Netflix','N'],['Prime Video','▶'],['VLC','◢']];let movies=[],posters=[];const seen=new Set();let selectedIndex=0,visibleTiles=[];const $=s=>document.querySelector(s);const toast=m=>{let t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2400)};
function artStyle(a,b){return `--c1:${a};--c2:${b}`}
function card(title,a,b,meta='',pct=0,wide=false,video=null,poster=null){let el=document.createElement('div');el.className='tile'+(wide?' wide':'');el.tabIndex=0;el.dataset.title=title;el.dataset.kind=video?'video':'movie';el.innerHTML=`<div class="tile-art" style="${artStyle(a,b)}"></div><div class="tile-title">${escapeHtml(title)}</div>${meta?`<div class="tile-meta">${meta}</div><div class="progress"><i style="--pct:${pct}%"></i></div>`:''}`;if(poster){el.querySelector('.tile-art').classList.add('has-art');el.querySelector('.tile-art').style.background=`linear-gradient(0deg,#0009,transparent 65%),url('${poster}') center/cover`};el.addEventListener('click',()=>openMovie(el,video));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openMovie(el,video)}});return el}
function render(){const dr=$('#driveRow');dr.innerHTML='';if(!movies.length){let e=document.createElement('div');e.style.cssText='color:#a9b4c2;padding:30px 4px';e.textContent='No movies yet. Click “📁 Scan folder” below and choose your movies folder.';dr.append(e)}movies.forEach((m,i)=>{const el=card(m.title,'#24495a','#101827',m.meta||'LOCAL FILE',0,false,m.file,m.art||posters[i]);m.el=el;dr.append(el)});visibleTiles=[...document.querySelectorAll('.tile')];select(0)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function select(i){if(!visibleTiles.length)return;selectedIndex=(i+visibleTiles.length)%visibleTiles.length;visibleTiles.forEach((x,n)=>x.classList.toggle('selected',n===selectedIndex));visibleTiles[selectedIndex].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}

/* ---- Folder scanning: each movie folder -> one tile (title from folder, poster from artwork inside) ---- */
const VID=/\.(mp4|m4v|mkv|avi|mov|webm|wmv|mpg|mpeg|ts|flv)$/i,IMG=/\.(jpe?g|png|webp)$/i;
function cleanTitle(n,isFile){if(isFile)n=n.replace(/\.[a-z0-9]{2,4}$/i,'');let t=n.replace(/[._]+/g,' ').replace(/\s+/g,' ').trim(),title=t,year='';
const m=t.match(/[\s(\[]((?:19|20)\d{2})(?=[\s)\]]|$)/);
if(m&&m.index>0){title=t.slice(0,m.index);year=m[1]}else{title=t.split(/\b(?:480p|576p|720p|1080p|2160p|4k|bluray|brrip|bdrip|webrip|web-dl|hdtv|dvdrip|x264|x265|h264)\b/i)[0]}
title=title.replace(/[\s\-–(\[]+$/,'').trim()||t;return year?`${title} (${year})`:title}
function baseName(n){return n.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'')}
function pickArt(imgs){const ok=imgs.filter(f=>!/fanart|backdrop|banner|screenshot|screen|sample|logo|clearart|disc|landscape/i.test(f.name));
for(const k of ['poster','folder','cover','front','thumb','thumbnail','movie','artwork','art','default','box']){const f=ok.find(f=>baseName(f.name)===k);if(f)return f}
if(ok.length===1)return ok[0];return ok.slice().sort((a,b)=>b.size-a.size)[0]||null}
const JUNK=new Set(['etrg','rarbg','yify','yts','ytsmx','ytsam','sub','subs','subtitles','video','videos','movie','movies','film','films','stream','bdmv','1080p','720p','2160p','x264','x265']);
const isJunk=n=>{const b=baseName(n);return !b||JUNK.has(b)||/^(cd|disc|disk|part)\d+$/.test(b)};
const EXTRA=/(^|[\s._\-\[(])(sample|trailers?|featurettes?|extras|bonus|behind the scenes|deleted scenes?|interviews|teasers?|bloopers?|gag reel|making of)([\s._\-\])]|$)/i;
const MIN_SIZE=250*1024*1024;
function scanFiles(files){const dirs=new Map();let skipped=0;
for(const f of files){if(!VID.test(f.name))continue;const path=f.webkitRelativePath||f.name,key=path+'|'+f.size;if(seen.has(key))continue;
if(f.size<MIN_SIZE||path.split('/').slice(1).some(seg=>EXTRA.test(seg))){skipped++;continue}
const dir=path.split('/').slice(0,-1).join('/');if(!dirs.has(dir))dirs.set(dir,[]);dirs.get(dir).push({f,key})}
let found=0;const newItems=[];
for(const [dir,vids] of dirs){const parts=dir?dir.split('/'):[],single=vids.length===1,folder=parts[parts.length-1];
vids.forEach(({f,key})=>{seen.add(key);let title,meta='';
if(single||isJunk(f.name.replace(/\.[^.]+$/,''))){let i=parts.length-1;while(i>=1&&isJunk(parts[i]))i--;
if(i>=1){title=cleanTitle(parts[i],false);meta=i>=2?cleanTitle(parts[i-1],false):''}else title=cleanTitle(f.name,true)}
else{title=cleanTitle(f.name,true);meta=parts.length>=2?cleanTitle(folder,false):''}
const it={file:f,title,art:null,meta};movies.push(it);newItems.push(it);found++})}
movies.sort((a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true,sensitivity:'base'}));render();newItems.forEach(queueThumb);
toast(found?`Found ${found} movie${found===1?'':'s'}${skipped?` (skipped ${skipped} small/extra video${skipped===1?'':'s'})`:''}`:'No new movies found in that folder')}
